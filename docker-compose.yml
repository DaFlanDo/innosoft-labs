# docker compose up --build  →  http://localhost:8000
#
# JWT_SECRET_KEY берётся из файла .env рядом с этим файлом (см. .env.docker.example).
# Порты, если 8000/9000 заняты: APP_PORT=8080 MINIO_PORT=19000 docker compose up

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: innosoft
      MYSQL_USER: innosoft
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-innosoft_secret}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # По TCP: при первой инициализации MySQL временно поднимается без сети,
      # и ping через сокет проходит раньше, чем база реально готова
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO Inc. больше не публикует образы (minio/minio удалён с Docker Hub),
    # поэтому сборка сообщества от Pigsty — та же программа и формат данных
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # файлы — браузер открывает ссылки отсюда
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # веб-консоль MinIO
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+aiomysql://innosoft:${MYSQL_PASSWORD:-innosoft_secret}@mysql:3306/innosoft?charset=utf8mb4
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Задайте JWT_SECRET_KEY в .env (openssl rand -hex 32)}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: innosoft
      DEBUG: "false"
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  mysqldata:
  redisdata:
  miniodata:
