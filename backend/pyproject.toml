[project]
name = "innosoft-labs-backend"
version = "0.1.0"
description = "InnoSoft Labs — Backend API для управления проектами"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "aioredis==2.0.1",
    "alembic==1.14.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.7.0",
    "email-validator==2.1.0",
    "python-socketio==5.11.0",
    "aiohttp==3.11.0",
    "PyJWT==2.10.0",
    "passlib[bcrypt]==1.7.4",
    "minio==7.2.0",
    "aiomysql==0.2.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
